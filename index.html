<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SEIKO NRP - Chargement</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    color: #fff;
    user-select: none;
    cursor: default;
  }
  #bgVideo {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background-image: url('seiko_bg.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    animation: slowZoom 30s ease-in-out infinite alternate;
  }
  @keyframes slowZoom {
    0%   { transform: scale(1.0)   translate(0, 0); filter: brightness(1) saturate(1); }
    50%  { transform: scale(1.08)  translate(-1%, -1%); filter: brightness(1.1) saturate(1.1); }
    100% { transform: scale(1.12)  translate(1%, 1%); filter: brightness(0.95) saturate(1.15); }
  }
  #bgAudio { display: none; }
  .overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.75) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* === TITRE EN HAUT === */
  .top-info {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    text-align: center;
    pointer-events: none;
  }
  .top-info h1 {
    font-family: 'Brush Script MT', cursive;
    font-size: 78px;
    font-weight: normal;
    letter-spacing: 4px;
    text-shadow: 0 4px 24px rgba(177, 76, 255, 0.9), 0 0 50px rgba(0,0,0,0.95);
    color: #fff;
  }
  .top-info p {
    font-size: 14px;
    letter-spacing: 10px;
    color: #ff6fb0;
    margin-top: -2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
  }

  /* === INFOS SERVEUR === */
  .server-info {
    position: fixed;
    top: 50%;
    left: 40px;
    transform: translateY(-50%);
    z-index: 5;
    background: rgba(15, 5, 30, 0.6);
    backdrop-filter: blur(10px);
    border-left: 3px solid #ff6fb0;
    padding: 18px 24px;
    border-radius: 0 8px 8px 0;
    min-width: 260px;
  }
  .server-info .row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px solid rgba(255,111,176,0.15);
  }
  .server-info .row:last-child { border-bottom: none; }
  .server-info .label { color: rgba(255,255,255,0.6); letter-spacing: 1px; }
  .server-info .val   { color: #ffb3d1; font-weight: 500; font-family: monospace; }

  /* === BARRE CHARGEMENT === */
  .loading-section {
    position: fixed;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%);
    width: 520px;
    z-index: 5;
    text-align: center;
  }
  .loading-label {
    font-size: 12px;
    letter-spacing: 7px;
    color: rgba(255,255,255,0.9);
    margin-bottom: 12px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .loading-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .loading-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    background: linear-gradient(90deg, #b14cff, #ff6fb0);
    border-radius: 2px;
    box-shadow: 0 0 12px rgba(255,111,176,0.9);
    animation: load 5s ease-in-out infinite;
  }
  @keyframes load {
    0%   { width: 0%; }
    50%  { width: 80%; }
    100% { width: 100%; }
  }
  .loading-percent {
    margin-top: 8px;
    font-size: 11px;
    color: #b084d9;
    letter-spacing: 3px;
    font-family: monospace;
  }

  /* === HINT EN BAS === */
  .mute-hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    background: rgba(15, 5, 30, 0.72);
    border: 1px solid rgba(177, 76, 255, 0.35);
    border-radius: 999px;
    font-size: 13px;
    color: #ffb3d1;
    letter-spacing: 1px;
    transition: opacity 0.5s;
  }
  .mute-hint.hidden { opacity: 0; pointer-events: none; }
  .mute-hint b { color: #fff; font-weight: 700; padding: 2px 8px; background: rgba(177, 76, 255, 0.3); border-radius: 4px; }
  .vol-icon {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #ff6fb0;
    transition: transform 0.15s, color 0.2s;
  }
  .vol-icon:hover { transform: scale(1.15); color: #ffb3d1; }
  .vol-icon svg { width: 100%; height: 100%; }

  .slider-wrap {
    position: relative;
    width: 200px;
    height: 26px;
    display: flex;
    align-items: center;
  }
  .slider-track {
    position: absolute;
    left: 0;
    right: 0;
    height: 4px;
    background: rgba(255,255,255,0.18);
    border-radius: 2px;
    overflow: hidden;
  }
  .slider-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 70%;
    background: linear-gradient(90deg, #b14cff 0%, #ff6fb0 100%);
    border-radius: 2px;
    transition: width 0.08s;
  }
  input[type="range"].vol-slider {
    -webkit-appearance: none;
    appearance: none;
    position: relative;
    width: 100%;
    height: 26px;
    background: transparent;
    cursor: pointer;
    z-index: 2;
  }
  input[type="range"].vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ff6fb0;
    box-shadow: 0 0 10px rgba(255,111,176,0.9);
    cursor: pointer;
  }
  input[type="range"].vol-slider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #ff6fb0;
    box-shadow: 0 0 10px rgba(255,111,176,0.9);
    cursor: pointer;
  }
  .vol-value {
    font-size: 13px;
    color: #ffb3d1;
    font-weight: 500;
    letter-spacing: 1px;
    min-width: 40px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .vol-hint {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    white-space: nowrap;
    letter-spacing: 2px;
  }

  /* bottom corners info */
  .corner {
    position: fixed;
    bottom: 12px;
    font-size: 11px;
    color: rgba(255,111,176,0.75);
    font-family: monospace;
    letter-spacing: 1px;
    z-index: 5;
  }
  .corner.left  { left: 20px; }
  .corner.right { right: 20px; }

</style>
</head>
<body>

<div id="bgVideo"></div>
<audio id="bgAudio" autoplay loop>
  <source src="seiko_audio.mp3" type="audio/mpeg">
</audio>

<div class="overlay"></div>

<div class="top-info">
  <h1>SEIKO</h1>
  <p>NATION ROLEPLAY</p>
</div>

<div class="server-info">
  <div class="row"><span class="label">SERVEUR</span><span class="val" id="svMap">Seiko NRP</span></div>
  <div class="row"><span class="label">GAMEMODE</span><span class="val" id="svGm">DarkRP</span></div>
  <div class="row"><span class="label">JOUEURS</span><span class="val" id="svPl">-/-</span></div>
  <div class="row"><span class="label">STATUT</span><span class="val" style="color:#7aff9e">EN LIGNE</span></div>
</div>

<div class="loading-section">
  <div class="loading-label">CHARGEMENT DU SERVEUR</div>
  <div class="loading-bar">
    <div class="loading-fill"></div>
  </div>
  <div class="loading-percent" id="pct">INITIALISATION...</div>
</div>

<div class="mute-hint" id="muteHint">
  <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4a1 1 0 0 0 1.7-.7V5.7A1 1 0 0 0 11 5L7 9H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  <span>Appuie sur <b>ESPACE</b> pour couper le son</span>
</div>

<div class="corner left" id="cornerLeft">discord.gg/seiko-nrp</div>
<div class="corner right">v1.0.0 — © SEIKO 2026</div>


<script>
(function(){
  // === GMOD : fonctions appelees par le jeu ===
  // Ces fonctions globales sont appelees par le moteur GMOD pendant le chargement
  var svMap = document.getElementById('svMap');
  var svGm  = document.getElementById('svGm');
  var svPl  = document.getElementById('svPl');

  window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode){
    if (servername) svMap.textContent = servername;
    if (gamemode)   svGm.textContent  = gamemode;
    if (maxplayers) svPl.textContent  = '0/' + maxplayers;
  };
  window.SetFilesTotal      = function(total){};
  window.SetFilesNeeded     = function(needed){};
  window.DownloadingFile    = function(filename){};
  window.SetStatusChanged   = function(status){
    var p = document.getElementById('pct');
    if (p && status) p.textContent = String(status).toUpperCase();
  };

  // URL params (DarkRP / FastDL)
  try {
    var u = new URLSearchParams(window.location.search);
    if (u.get('mapname'))    svMap.textContent = u.get('mapname');
    if (u.get('gamemode'))   svGm.textContent  = u.get('gamemode');
    if (u.get('maxplayers')) svPl.textContent  = '0/' + u.get('maxplayers');
  } catch(e){}

  // === SON ===
  const audio = document.getElementById('bgAudio');
  const hint  = document.getElementById('muteHint');
  const pct   = document.getElementById('pct');

  const DEFAULT_VOL = 0.20;
  let muted = false;

  audio.volume = DEFAULT_VOL;

  // Tente autoplay (fonctionne en GMOD CEF; navigateurs bloquent mais on s'en moque ici)
  audio.play().catch(() => {
    // Si bloque en navigateur, on debloquera au premier clic/touche
    const unlock = () => {
      audio.volume = muted ? 0 : DEFAULT_VOL;
      audio.play().catch(()=>{});
    };
    document.addEventListener('click', unlock, { once: true, passive: true });
  });

  // ESPACE = toggle mute/unmute
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
      e.preventDefault();
      muted = !muted;
      audio.volume = muted ? 0 : DEFAULT_VOL;
      if (muted) {
        hint.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4a1 1 0 0 0 1.7-.7V5.7A1 1 0 0 0 11 5L7 9H4a1 1 0 0 0-1 1z"/><line x1="15" y1="9" x2="21" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Son coupe — <b>ESPACE</b> pour reactiver</span>';
      } else {
        hint.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M3 10v4a1 1 0 0 0 1 1h3l4 4a1 1 0 0 0 1.7-.7V5.7A1 1 0 0 0 11 5L7 9H4a1 1 0 0 0-1 1z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg><span>Appuie sur <b>ESPACE</b> pour couper le son</span>';
      }
    }
  });

  // compteur de chargement
  let p = 0;
  const steps = ["INITIALISATION","CONNEXION SERVEUR","SYNCHRONISATION","CHARGEMENT MAP","PRET A JOUER"];
  setInterval(() => {
    p = (p + 1) % 101;
    const step = steps[Math.min(Math.floor(p / 21), steps.length - 1)];
    pct.textContent = step + " — " + p + "%";
  }, 70);
})();
</script>

</body>
</html>
